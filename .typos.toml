[files]
extend-exclude = [
    "Library/Logs/",
    "Library/Application Support/minecraft/",
    # Regenerated by `just dump-brew` from live `brew` formula descriptions;
    # third-party text we don't author and can't fix upstream.
    "Brewfile",
]

[default.extend-words]
certifi = "certifi"

[default]
extend-ignore-re = [
    "2ndBrain",
    # `\(ba\)\?sh` in guard regex patterns (matches "sh" or "bash"), not the
    # English word "ba". Appears verbatim in the guard's Rust policy
    # (crates/ness/src/policy.rs).
    "\\(ba\\)\\?sh",
    # Abbreviated commit hashes that tools print in version strings, such as
    # `grok 1.0.50 (c58f321264ba)` or `cmux 0.65.0 (108) [dda24fbd2]`. The harness
    # probe copies them into generated docs/, so the hex fragments (`ba`) are
    # not words.
    "[(\\[][0-9a-f]{7,40}[)\\]]",
]
