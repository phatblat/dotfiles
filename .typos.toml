[files]
extend-exclude = [
    "Library/Logs/",
    "Library/Application Support/minecraft/",
    # Regenerated by `just dump-brew` from live `brew` formula descriptions;
    # third-party text we don't author and can't fix upstream.
    "Brewfile",
]

[default.extend-words]
certifi = "certifi"

[default]
extend-ignore-re = [
    "2ndBrain",
    # `\(ba\)\?sh` in guard regex patterns (matches "sh" or "bash"), not the
    # English word "ba". Appears verbatim in the guard's Rust policy
    # (crates/ness/src/policy.rs).
    "\\(ba\\)\\?sh",
    # 12-char git commit hashes in harness version strings, e.g.
    # "grok 1.0.50 (c58f321264ba)" (docs/harness/*); hex runs can contain "ba".
    "\\([0-9a-f]{12}\\)",
]
