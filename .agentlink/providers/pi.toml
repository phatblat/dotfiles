# Pi — not shipped by agentlink 0.0.1.
#
# Skills only. Pi reaches the canonical root because ~/.pi/agent/settings.json
# carries `"skills": ["~/.agents/skills"]`, generated by render_pi_settings in
# scripts/agent-harnesses.py. Instructions are omitted deliberately: Pi loads
# ~/.agents/harness/instructions.md through its own prompts/extension surface,
# not AGENTS.md, and agentlink has no strategy for "a value inside another
# tool's JSON config".

schema = 1
id = "pi"
name = "Pi"

[[capability]]
resource = "skills"
strategy = "native"
path = ".agents/skills"
note = "~/.pi/agent/settings.json names the shared root in its `skills` list."
