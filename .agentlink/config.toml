# agentlink configuration — https://github.com/fialhosoft/agentlink
#
# Providers are listed explicitly instead of relying on agentlink's "serve every
# provider I know about" default: a future release that ships a new provider
# would otherwise materialise new paths in $HOME on the next `agentlink apply`
# with nobody deciding to.
#
# claude-code is deliberately absent. Both of its capabilities are permanently
# blocked here: ~/CLAUDE.md is hand-authored Claude-specific guidance, not a
# copy of ~/AGENTS.md, and ~/.claude/skills holds real content (gstack's skills
# plus the pointer files scripts/agent-harnesses.py generates), so it can never
# become one symlink to ~/.agents/skills. Excluding it keeps
# `agentlink status --check` a usable signal instead of a permanent exit 2.
#
# crush, grok, omp and pi are not shipped by agentlink; their manifests live in
# .agentlink/providers/ and load on top of the embedded set.

version = 1
providers = [
  "antigravity",
  "codex",
  "crush",
  "cursor",
  "github-copilot",
  "grok",
  "omp",
  "opencode",
  "pi",
]

# Three of agentlink's four generated paths are intentionally *tracked*, not
# gitignored: `/.agentlink/lock.toml`, `/.github/skills`, and
# `/.opencode/skills` are committed so a fresh clone has working skill
# symlinks without running `agentlink apply` first. Only `/.cursor/skills` is
# ignored, and not through this file's `[gitignore]` block (`manage = false`
# means agentlink never touches root `.gitignore`) — Cursor's own managed
# block in `.cursor/.gitignore` re-ignores `skills` after un-ignoring it for
# "User's personal skills", and the nested file's DOTFILES ALLOWLIST leaves
# that re-ignore in place rather than overriding it. Root `.gitignore` has no
# agentlink-owned entries at all.
[gitignore]
manage = false
