name: lint

on:
  push:
    branches: [main]
    paths:
      - ".config/home-manager/**"
      - ".config/nushell/**"
      - ".config/zsh/functions/**"
      - ".config/mise/config.toml"
      - ".gitignore"
      - "bin/**"
      - "justfile"
      - "scripts/**"
      - "tests/**"
      - ".codex/config.toml"
      - "**.yml"
      - "**.yaml"
      # changed.sh decides whether the pull_request run does any work, so a
      # main-branch commit touching only it still needs a post-merge lint.
      - ".github/scripts/**"
  # No paths filter on pull_request, deliberately. `lint` and `test` are required
  # status checks, and a required check that never runs leaves the pull request
  # stuck on "Expected" forever. The jobs always start and decide for themselves
  # whether there is work to do — see the "Detect relevant changes" step.
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:00 UTC — catch drift from tool updates
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Repo root IS the home directory; remap HOME so ~ resolves to checkout
      HOME: ${{ github.workspace }}
      # Allowlist only tools needed for linting to prevent mise from attempting
      # to install macOS-only tools (tart, cargo-based tools, etc.) on Linux CI.
      MISE_ENABLE_TOOLS: "just,shellcheck,ruff,ty,bats,github:nushell/nushell,python,pipx:yamllint,npm:prettier,shfmt,aqua:anordal/shellharden"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./.github/scripts/changed.sh lint

      # Let the action run the install: it only caches tools it installed
      # itself, so `install: false` plus a separate `mise install` step meant
      # the cache was never written. install_args keeps the tool set scoped.
      - name: Install mise and tools
        if: steps.changed.outputs.relevant == 'true'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: "just shellcheck ruff ty bats github:nushell/nushell python pipx:yamllint npm:prettier shfmt aqua:anordal/shellharden"

      - name: Install zsh
        if: steps.changed.outputs.relevant == 'true'
        timeout-minutes: 5
        run: |
          # Runner-provided Microsoft repositories intermittently return 403.
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update && sudo apt-get install -y zsh

      # Runs `check` minus the macOS-only halves: `just check` also pulls in
      # `test`, whose bats suites need xcrun/xcodebuild/brew and so belong to
      # the macos-latest `test` job below.
      - name: Lint
        if: steps.changed.outputs.relevant == 'true'
        run: |
          eval "$(mise activate bash)"
          just lint typecheck-python

      - name: Validate nix flake
        if: steps.changed.outputs.relevant == 'true'
        run: nix flake show --json "$HOME/.config/home-manager" 2>&1 | head -20
        continue-on-error: true

  test:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Repo root IS the home directory; remap HOME so ~ resolves to checkout
      HOME: ${{ github.workspace }}
      # Under the remapped HOME the repo's .gitconfig becomes the global git
      # config, and its commit.gpgsign points at an SSH key that only exists
      # on real machines — override so test fixture commits don't fail
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: commit.gpgsign
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./.github/scripts/changed.sh lint

      - name: Install mise and tools
        if: steps.changed.outputs.relevant == 'true'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: "just shellcheck ruff bats bat starship aqua:shenwei356/rush github:nushell/nushell"

      - name: Install test-exercised tools
        if: steps.changed.outputs.relevant == 'true'
        run: brew install diff-so-fancy git-subrepo

      - name: Generate SSH key for sshkey tests
        if: steps.changed.outputs.relevant == 'true'
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N "" -f "$HOME/.ssh/id_ed25519"

      - name: Test
        if: steps.changed.outputs.relevant == 'true'
        run: |
          eval "$(mise activate bash)"
          just test
