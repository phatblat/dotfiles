name: lint

on:
  push:
    branches: [main]
    paths:
      - ".config/fish/**"
      - ".config/home-manager/**"
      - ".config/nushell/**"
      - ".config/zsh/functions/**"
      - ".config/mise/config.toml"
      - ".gitignore"
      - "bin/**"
      - "justfile"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - ".config/fish/**"
      - ".config/home-manager/**"
      - ".config/nushell/**"
      - ".config/zsh/functions/**"
      - ".config/mise/config.toml"
      - ".gitignore"
      - "bin/**"
      - "justfile"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/lint.yml"
  schedule:
    # Weekly Monday 06:00 UTC — catch drift from tool updates
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Repo root IS the home directory; remap HOME so ~ resolves to checkout
      HOME: ${{ github.workspace }}
      MISE_PIN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Install mise-managed tools
        run: mise install just shellcheck ruff bats "github:nushell/nushell"

      - name: Install fish and zsh
        run: |
          # Runner-provided Microsoft repositories intermittently return 403.
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update && sudo apt-get install -y fish zsh

      - name: Lint
        run: |
          eval "$(mise activate bash)"
          just lint

      - name: Validate nix flake
        run: nix flake show --json "$HOME/.config/home-manager" 2>&1 | head -20
        continue-on-error: true

  test:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Repo root IS the home directory; remap HOME so ~ resolves to checkout
      HOME: ${{ github.workspace }}
      MISE_PIN: "1"
      # Under the remapped HOME the repo's .gitconfig becomes the global git
      # config, and its commit.gpgsign points at an SSH key that only exists
      # on real machines — override so test fixture commits don't fail
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: commit.gpgsign
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Install mise-managed tools
        run: mise install just shellcheck ruff bats bat "aqua:shenwei356/rush" "github:nushell/nushell"

      - name: Install fish and test-exercised tools
        run: brew install fish diff-so-fancy git-subrepo

      - name: Generate SSH key for sshkey tests
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N "" -f "$HOME/.ssh/id_ed25519"

      - name: Test
        run: |
          eval "$(mise activate bash)"
          just test
