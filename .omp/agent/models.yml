providers:
  spark:
    baseUrl: http://spark1.local:8000/v1
    api: openai-completions
    apiKey: SPARK_API_KEY
    compat:
      supportsDeveloperRole: false
      supportsReasoningEffort: false
    models:
      - id: Inferact/Qwen3.8-27B-NVFP4
        name: Qwen3.8-27B (spark1, NVFP4 + MTP)
        reasoning: true
        input:
          - text
        contextWindow: 131072
        maxTokens: 8192
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
      - id: Baekpica/DeepSeek-V4-Flash-0731-120B-REAM-104E-NVFP4
        name: DeepSeek-V4-Flash-0731 120B REAM (spark1, NVFP4)
        reasoning: true
        input:
          - text
        contextWindow: 196608
        maxTokens: 8192
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
  # Reflection - hosted Beam inference. Full notes (limits, thinking, history,
  # auth) live in .omp/profiles/reflection/agent/models.yml; keep the two in sync.
  reflection:
    api: openai-completions
    apiKey: REFLECTION_API_KEY
    baseUrl: https://api.reflection.ai/openai/v1
    compat:
      supportsStore: false
      supportsDeveloperRole: false
      supportsMultipleSystemMessages: false
      supportsUsageInStreaming: true
      maxTokensField: max_completion_tokens
      supportsToolChoice: true
      supportsForcedToolChoice: true
      supportsStrictMode: false
      toolStrictMode: none
      supportsReasoningEffort: true
      thinkingFormat: openai
      reasoningContentField: reasoning_content
      requiresReasoningContentForToolCalls: true
      requiresReasoningContentForAllAssistantTurns: true
      allowsSyntheticReasoningContentForToolCalls: true
    models:
      - id: Beam-1.0-501B-A23B
        name: Beam 1.0 501B A23B
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          requiresEffort: true
          defaultLevel: high
        input: [text]
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        contextWindow: 1048576
        maxTokens: 131072
