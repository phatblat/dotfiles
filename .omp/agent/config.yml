providers:
  webSearchOrder: []
setupVersion: 1
modelRoles:
  plan: anthropic/claude-opus-5:xhigh
  slow: anthropic/claude-fable-5
  smol: anthropic/claude-haiku-4-5
  default: anthropic/claude-sonnet-5
  vision: anthropic/claude-opus-5
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
tools:
  approvalMode: yolo
  approval:
    bash: allow
display:
  showTokenUsage: true
  cacheMissMarker: true
advisor:
  enabled: false
  syncBacklog: "off"
prewalk:
  enabled: true
features:
  unexpectedStopDetection: true
branchSummary:
  enabled: true
secrets:
  enabled: true
personality: pragmatic
cycleOrder:
  - smol
  - default
  - plan
  - slow
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: wait
memory:
  backend: mnemopi
autolearn:
  enabled: true
task:
  agentAdvisor:
    task: "on"
worktree:
  base: ~/.worktrees
