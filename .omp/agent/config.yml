providers:
  anthropic:
    serverSideFallback: false
  streamFirstEventTimeoutSeconds: 300
  streamIdleTimeoutSeconds: 300
setupVersion: 2
modelRoles:
  plan: anthropic/claude-opus-5-5:xhigh
  slow: google-antigravity/gemini-3.8-flash
  smol: anthropic/claude-haiku-5-5:auto
  default: anthropic/claude-sonnet-5-5:medium
  commit: anthropic/claude-haiku-5-5:low
  delivery_build: anthropic/claude-sonnet-5-5:high
  delivery_test: anthropic/claude-haiku-5-5:auto
  delivery_review: anthropic/claude-opus-5-5:xhigh
extensions:
  - ~/.omp/agent/teams/feature-delivery
# Disable the shared ness harness guard hook (agent/hooks/pre/harness-guard.ts),
# which routes every omp tool call through ~/.local/bin/ness. The id is the
# hook capability's extension id: hook:<type>:<tool>:<file name>.
disabledExtensions:
  - hook:pre:harness-guard:harness-guard.ts
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
tools:
  approvalMode: yolo
bash:
  patterns:
    - match: sudo *
      approval: deny
    - match: sudo
      approval: deny
  allowCompoundCommands: true
  gitGuard: true
display:
  showTokenUsage: true
  cacheMissMarker: true
  hideToolActivity: true
  showTurnTime: true
  collapseCompacted: true
  shimmer: classic
advisor:
  enabled: false
  syncBacklog: "off"
prewalk:
  enabled: false
features:
  unexpectedStopDetection: smart
branchSummary:
  enabled: true
secrets:
  enabled: true
personality: pragmatic
cycleOrder:
  - default
  - plan
  - smol
  - slow
steeringMode: all
followUpMode: all
interruptMode: wait
memory:
  backend: mnemopi
autolearn:
  enabled: true
task:
  agentAdvisor:
    task: "on"
  showResolvedModelBadge: true
  eager: preferred
  enableEffort: true
  isolation:
    commits: ai
    enabled: true
    apply: true
worktree:
  base: ~/.worktrees
  cleanSource: true
  onStart: ask
  onExit: ask
  clone: false
hideThinkingBlock: false
theme:
  dark: dark-aurora
  light: light-aurora-day
symbolPreset: nerd
statusLine:
  preset: default
  separator: powerline-thin
  sessionAccent: true
  transparent: false
  showHookStatus: true
retry:
  usageAwareFallback: true
doubleEscapeAction: tree
composer:
  shape: field
  predictions: false
codexResets:
  autoRedeem: "no"
treeFilterMode: all
spelling:
  autocorrect: false
error:
  notify: "on"
skills:
  enableClaudeProject: false
  enableSkillCommands: true
  ignoredSkills:
    - codex/*
plan:
  autosave: false
commands:
  enableClaudeProject: false
  enableOpencodeProject: false
input:
  bareExitOnEmptySession: false
bashInterceptor:
  enabled: true
github:
  enabled: true
vault:
  enabled: true
checkpoint:
  enabled: true
ratchet:
  enabled: true
computer:
  enabled: true
generate_image:
  enabled: true
speechgen:
  enabled: true
find:
  enabled: auto
astGrep:
  enabled: true
goal:
  statusInFooter: false
