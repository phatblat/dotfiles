providers:
  webSearchOrder: []
  anthropic:
    serverSideFallback: false
setupVersion: 2
modelRoles:
  plan: anthropic/claude-opus-5:xhigh
  slow: anthropic/claude-fable-5
  smol: anthropic/claude-haiku-4-5
  default: xai-oauth/grok-4.6
  vision: anthropic/claude-opus-5
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
tools:
  approvalMode: yolo
  approval:
    bash: allow
display:
  showTokenUsage: true
  cacheMissMarker: true
  hideToolActivity: true
advisor:
  enabled: false
  syncBacklog: "off"
prewalk:
  enabled: false
features:
  unexpectedStopDetection: smart
branchSummary:
  enabled: true
secrets:
  enabled: true
personality: pragmatic
cycleOrder:
  - default
  - plan
  - smol
  - slow
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: wait
memory:
  backend: mnemopi
autolearn:
  enabled: true
task:
  agentAdvisor:
    task: "on"
worktree:
  base: ~/.worktrees
hideThinkingBlock: false
theme:
  dark: dark-aurora
symbolPreset: nerd
statusLine:
  preset: default
  separator: powerline-thin
  sessionAccent: true
  transparent: false
  showHookStatus: true
retry:
  usageAwareFallback: true
doubleEscapeAction: tree
composer:
  shape: field
