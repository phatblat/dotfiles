display:
  showTokenUsage: true
  cacheMissMarker: true
  hideToolActivity: true
advisor:
  enabled: false
  syncBacklog: "off"
prewalk:
  enabled: false
features:
  unexpectedStopDetection: smart
branchSummary:
  enabled: true
secrets:
  enabled: true
personality: pragmatic
cycleOrder:
  - default
  - plan
  - smol
  - slow
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: wait
memory:
  backend: mnemopi
autolearn:
