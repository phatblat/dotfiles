# Casper - Ditto's homegrown OpenAI-compatible AI router.
#
# Endpoint:  https://casper-api.ditto.live/v1
# Auth:      export CASPER_API_KEY=... (or add CASPER_API_KEY=... to ~/.env)
#            The apiKey value below is resolved as an env-var name first, literal second.
# Catalog:   GET /v1/models publishes context_length/max_model_len plus a per-model
#            `reasoning_param` naming the thinking wire, and also
#            `supported_reasoning_efforts` / `reasoning_effort_normalization`
#            (not visible to the sync script before 2026-11). Values seen there:
#              - "reasoning_effort"                    -> provider baseline below
#              - "chat_template_args.enable_thinking"   -> per-model extraBody override
#              - ""                                    -> non-reasoning model
#            Non-chat ids (rune, qwen3-reranker-8b) are absent from /v1/models;
#            see the casper-decisions and casper-rerank providers below.
# Pricing:   per-1M-token costs come from the Fireworks Serverless Standard rates
#            at https://docs.fireworks.ai/serverless/pricing, scraped by
#            scripts/sync-casper-models.py. Models Casper serves unmetered (FREE
#            in the admin catalog at https://casper.ditto.live/catalog) are zeroed
#            via FREE_MODELS in the sync script; models absent from the Fireworks
#            page (e.g. minimax-m3p1-flash, ultramarine-1-flash-us) are
#            hand-priced in MANUAL_PRICES there with source and date.
# Access:    Invocation is entitled per key, and `GET /v1/models` lists the whole
#            catalog regardless of entitlement. Last verified 2026-08-24: this key
#            could invoke the then-current Kimi K3 id and `auto`; `kimi-k2.6`,
#            `glm-5.2`, and `dittoaicoder` returned 403
#            {"detail":"not authorized to invoke <id>"}. The catalog has since
#            replaced that Kimi id with `kimi-k3p1-pro` and added
#            `ultramarine-1-flash-us` (opt-in in the admin catalog); entitlement
#            for those two ids has not been re-verified. The named models stay
#            declared below so that widening `enabledModels` in config.yml is
#            the only change needed once access is granted.
# Known issue: the retired Kimi K3 id buffered its tool calls into a single SSE
#            delta emitted only after the full arguments were generated. That
#            behaviour has not been re-checked on `kimi-k3p1-pro`, so it gets the
#            provider-level `streamIdleTimeoutMs: 120000` and no local override.
providers:
  # Non-chat Casper routes. /v1/models lists only chat models, so neither id is
  # discovered or touched by scripts/sync-casper-models.py; both are declared
  # by hand. Keep these providers above `casper`: the sync script appends new
  # override blocks at end of file, so casper's modelOverrides must stay last.
  #
  # Rune 26B-A4B: System One decision model (judge kind). The `typesafe` API
  # posts the System One body to {baseUrl}/v1/systemone, which Casper serves
  # (its /v1/decisions route rejects that body with 422). Price: Fireworks
  # Standard "Decision models" rate (input only; cached input is 20% of input).
  casper-decisions:
    api: typesafe
    apiKey: CASPER_API_KEY
    baseUrl: https://casper-api.ditto.live
    models:
      - id: rune
        name: Rune 26B-A4B
        input: [text]
        cost: { input: 0.042, output: 0, cacheRead: 0.0084, cacheWrite: 0 }

  # Qwen3 Reranker 8B (rerank kind) on Casper's POST /v1/rerank. Known issue:
  # OMP's openrouter-rerank runner requires a `results` array, but Casper answers
  # with `data` (verified 2026-11-20), so OMP calls fail with "rerank response is
  # malformed" until one side changes. Price from Casper's catalog card
  # (2026-11-20); Fireworks has no individual row for this model.
  casper-rerank:
    apiKey: CASPER_API_KEY
    baseUrl: https://casper-api.ditto.live/v1
    models:
      - id: qwen3-reranker-8b
        name: Qwen3 Reranker 8B
        api: openrouter-rerank # runner api set on the model entry (schema rejects runner apis at provider level)
        cost: { input: 0.20, output: 0, cacheRead: 0.20, cacheWrite: 0 }

  casper:
    api: openai-completions
    apiKey: CASPER_API_KEY
    baseUrl: https://casper-api.ditto.live/v1
    compat:
      # The router fronts self-hosted OSS engines, so OpenAI-only request
      # features are off and tool schemas go out non-strict.
      supportsStore: false
      supportsDeveloperRole: false
      supportsMultipleSystemMessages: false
      supportsUsageInStreaming: true
      maxTokensField: max_tokens
      supportsToolChoice: true
      supportsForcedToolChoice: true
      supportsStrictMode: false
      toolStrictMode: none
      # Majority wire: reasoning_effort. Models advertising a chat-template
      # switch override this per model.
      supportsReasoningEffort: true
      thinkingFormat: openai
      reasoningContentField: reasoning_content
      streamIdleTimeoutMs: 120000
    discovery:
      type: openai-models-list
    modelOverrides:
      # Discovered models carry zero cost because Casper's /v1/models does not
      # expose pricing. Override cost per model id. All four cost fields are
      # required; omitted ones would retain the discovered zero base value.
      auto:
        name: Casper Auto Router
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }

      ditto-support:
        name: Ditto Support
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }

      dittoaicoder:
        name: Ditto AI Coder
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }

      ember-1:
        name: Ember-1
        cost: { input: 3.00, output: 15.00, cacheRead: 0.30, cacheWrite: 0 }

      gemini-4-carbon:
        name: Gemini 4 Carbon
        cost: { input: 4.00, output: 20.00, cacheRead: 0.20, cacheWrite: 0 }
        # Catalog 2026-11-19: reasoning_effort levels [low, medium, high], no
        # "none" tier, so no reasoningDisableMode: OMP clamps a thinking-off
        # request to the lowest effort.
        thinking:
          mode: effort
          efforts: [low, medium, high]
          defaultLevel: high
          effortMap: {}

      gemini-4-hydrogen:
        name: Gemini 4 Hydrogen
        cost: { input: 1.50, output: 7.50, cacheRead: 0.07, cacheWrite: 0 }
        # Catalog 2026-11-19: reasoning_effort levels [low, medium, high,
        # xhigh], no "none" tier; see gemini-4-carbon.
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh]
          defaultLevel: high
          effortMap: {}

      gemini-4-neon:
        name: Gemini 4 Neon
        cost: { input: 3.00, output: 15.00, cacheRead: 0.15, cacheWrite: 0 }
        # Catalog 2026-11-19: reasoning_effort levels [low, medium, high,
        # xhigh], no "none" tier; see gemini-4-carbon.
        thinking:
          mode: effort
          efforts: [low, medium, high, max]
          defaultLevel: high
          effortMap: {}

      glm-5.3:
        name: Glm 5.3
        cost: { input: 1.40, output: 4.40, cacheRead: 0.26, cacheWrite: 0 }

      glm-5.3-flash:
        name: Glm 5.3 Flash
        cost: { input: 0.15, output: 0.50, cacheRead: 0.03, cacheWrite: 0 }

      kimi-k3:
        name: Kimi K3
        cost: { input: 3.00, output: 15.00, cacheRead: 0.30, cacheWrite: 0 }

      kimi-k3p1-pro:
        name: Kimi K3p1 Pro
        cost: { input: 2.00, output: 10.00, cacheRead: 0.20, cacheWrite: 0 }
        # Catalog 2026-11-06: reasoning_effort levels [none, minimal, low,
        # medium, high, xhigh, max], no normalization map. OMP's efforts
        # schema tops out at minimal..max (no "none"); declaring the ladder
        # still makes OMP send reasoning_effort explicitly and expose the
        # levels in the model selector. A thinking-off request maps to
        # reasoning_effort "none" via reasoningDisableMode below.
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh, max]
          defaultLevel: high
          effortMap: {}
        compat:
          supportsReasoningEffort: true
          # The route accepts "none" as a real off switch; send it instead of
          # clamping a thinking-off request to the lowest effort.
          reasoningDisableMode: none-effort

      minimax-m3:
        name: Minimax M3
        cost: { input: 0.30, output: 1.20, cacheRead: 0.06, cacheWrite: 0 }

      minimax-m3p1-flash:
        name: Minimax M3p1 Flash
        cost: { input: 0.15, output: 0.60, cacheRead: 0.01, cacheWrite: 0 }
        reasoning: true
        # MiniMax-M3.1-Flash defaults reasoning_effort to max when the field is
        # absent, so OMP's default level was being billed at the top tier.
        # Declaring the ladder makes OMP send reasoning_effort explicitly.
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh, max]
          defaultLevel: medium
          # The route accepts none/minimal/low/medium/high/xhigh/max/adaptive;
          # probe 2026-10-29 confirmed each tier returns 200 and that an
          # out-of-ladder value is rejected with a 400.
          effortMap: {}
        compat:
          supportsReasoningEffort: true
          # The route accepts "none" as a real off switch, so send it instead
          # of clamping a thinking-off request to the lowest effort.
          reasoningDisableMode: none-effort

      qwen3.8-max:
        name: Qwen3.8 Max
        supportsTools: false
        cost: { input: 2.00, output: 6.00, cacheRead: 0.25, cacheWrite: 0 }
        compat:
          supportsReasoningEffort: false
          extraBody:
            chat_template_args:
              enable_thinking: false
          whenThinking:
            extraBody:
              chat_template_args:
                enable_thinking: true

      ultramarine-1-flash-us:
        name: Ultramarine 1 Flash Us
        cost: { input: 0.23, output: 0.75, cacheRead: 0.04, cacheWrite: 0 }
        # Catalog 2026-11-06: reasoning_effort levels [minimal, low, medium,
        # high, xhigh, max] with normalization none -> minimal (no true "none"
        # tier), so no reasoningDisableMode here: OMP clamps a thinking-off
        # request to the lowest effort, which reproduces the normalization.
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh, max]
          defaultLevel: high
          effortMap: {}
