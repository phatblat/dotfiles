# Casper - Ditto's homegrown OpenAI-compatible AI router.
#
# Endpoint:  https://casper-api.ditto.live/v1
# Auth:      export CASPER_API_KEY=... (or add CASPER_API_KEY=... to ~/.env)
#            The apiKey value below is resolved as an env-var name first, literal second.
# Catalog:   GET /v1/models publishes context_length/max_model_len plus a per-model
#            `reasoning_param` naming the thinking wire. Values seen there:
#              - "reasoning_effort"                    -> provider baseline below
#              - "chat_template_args.enable_thinking"   -> per-model extraBody override
#              - ""                                    -> non-reasoning model
#            Re-check `GET /v1/models` after the router adds or retires a model.
# Pricing:   per-1M-token costs come from the Baseten pricing page, except models
#            Casper serves unmetered (FREE in the admin catalog at
#            https://casper.ditto.live/catalog), which free_model() zeroes out.
#            /v1/models does not expose the unmetered flag, so that list is
#            maintained by hand in the sync script. Models absent from Baseten's
#            page (e.g. `ultramarine-1-flash-us`) get manual_price() rates there.
# Access:    Invocation is entitled per key, and `GET /v1/models` lists the whole
#            catalog regardless of entitlement. Last verified 2026-08-24: this key
#            could invoke the then-current Kimi K3 id and `auto`; `kimi-k2.6`,
#            `glm-5.2`, and `dittoaicoder` returned 403
#            {"detail":"not authorized to invoke <id>"}. The catalog has since
#            replaced that Kimi id with `kimi-k3p1-pro` and added
#            `ultramarine-1-flash-us` (opt-in in the admin catalog); entitlement
#            for those two ids has not been re-verified. The named models stay
#            declared below so that widening `enabledModels` in config.yml is
#            the only change needed once access is granted.
# Known issue: the retired Kimi K3 id buffered its tool calls into a single SSE
#            delta emitted only after the full arguments were generated. That
#            behaviour has not been re-checked on `kimi-k3p1-pro`, so it gets the
#            provider-level `streamIdleTimeoutMs: 120000` and no local override.
providers:
  casper:
    api: openai-completions
    apiKey: CASPER_API_KEY
    baseUrl: https://casper-api.ditto.live/v1
    compat:
      # The router fronts self-hosted OSS engines, so OpenAI-only request
      # features are off and tool schemas go out non-strict.
      supportsStore: false
      supportsDeveloperRole: false
      supportsMultipleSystemMessages: false
      supportsUsageInStreaming: true
      maxTokensField: max_tokens
      supportsToolChoice: true
      supportsForcedToolChoice: true
      supportsStrictMode: false
      toolStrictMode: none
      # Majority wire: reasoning_effort. Models advertising a chat-template
      # switch override this per model.
      supportsReasoningEffort: true
      thinkingFormat: openai
      reasoningContentField: reasoning_content
      streamIdleTimeoutMs: 120000
    discovery:
      type: openai-models-list
    modelOverrides:
      # Discovered models carry zero cost because Casper's /v1/models does not
      # expose pricing. Override cost per model id. All four cost fields are
      # required; omitted ones would retain the discovered zero base value.
      auto:
        name: Casper Auto Router
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }

      dittoaicoder:
        name: Ditto AI Coder
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }

      ember:
        name: Ember-1
        cost: { input: 3.00, output: 15.00, cacheRead: 0.30, cacheWrite: 0 }

      glm-5.3:
        name: Glm 5.3
        cost: { input: 1.40, output: 4.40, cacheRead: 0.26, cacheWrite: 0 }

      glm-5.3-flash:
        name: Glm 5.3 Flash
        cost: { input: 0.15, output: 0.50, cacheRead: 0.03, cacheWrite: 0 }

      kimi-k3p1-pro:
        name: Kimi K3p1 Pro
        # Discovery cannot derive reasoning for ids the bundled catalog
        # lacks, which materializes reasoning:false and drops the ladder.
        reasoning: true
        cost: { input: 2.00, output: 10.00, cacheRead: 0.20, cacheWrite: 0 }
        # Catalog GET /v1/models (probed 2026-11-05): reasoning_param
        # "reasoning_effort", mode "levels", ladder
        # none/minimal/low/medium/high/xhigh/max, top "max". Every tier plus a
        # negative case verified live (200s, 400 out-of-ladder). "none" is a
        # real off switch on the route (0 reasoning tokens), but OMP's
        # thinking.efforts schema refuses to list it (verified via `omp
        # models`), so the declared ladder starts at minimal and a
        # thinking-off request falls back to the lowest rung; OMP's fallback
        # sends that rung's effort, which still emits reasoning.
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh, max]
          # Matching the server baseline: omitted reasoning_effort produced
          # ~41-62 reasoning tokens on toy prompts, mid-ladder territory.
          defaultLevel: medium
          effortMap: {}
        compat:
          supportsReasoningEffort: true
          reasoningDisableMode: none-effort

      minimax-m3:
        name: Minimax M3
        cost: { input: 0.30, output: 1.20, cacheRead: 0.06, cacheWrite: 0 }

      minimax-m3p1-flash:
        name: Minimax M3p1 Flash
        cost: { input: 0.15, output: 0.60, cacheRead: 0.015, cacheWrite: 0 }
        reasoning: true
        # MiniMax-M3.1-Flash defaults reasoning_effort to max when the field is
        # absent, so OMP's default level was being billed at the top tier.
        # Declaring the ladder makes OMP send reasoning_effort explicitly.
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh, max]
          defaultLevel: minimal
          # The route accepts none/minimal/low/medium/high/xhigh/max/adaptive;
          # probe 2026-10-29 confirmed each tier returns 200 and that an
          # out-of-ladder value is rejected with a 400.
          effortMap: {}
        compat:
          supportsReasoningEffort: true
          # The route accepts "none" as a real off switch, so send it instead
          # of clamping a thinking-off request to the lowest effort.
          reasoningDisableMode: none-effort

      qwen3.8-max:
        name: Qwen3.8 Max
        supportsTools: false
        cost: { input: 2.00, output: 6.00, cacheRead: 0.25, cacheWrite: 0 }
        compat:
          supportsReasoningEffort: false
          extraBody:
            chat_template_args:
              enable_thinking: false
          whenThinking:
            extraBody:
              chat_template_args:
                enable_thinking: true

      ultramarine-1-flash-us:
        # Discovery cannot derive reasoning for ids the bundled catalog
        # lacks, which materializes reasoning:false and drops the ladder.
        reasoning: true
        name: Ultramarine 1 Flash Us
        cost: { input: 0.23, output: 0.75, cacheRead: 0.04, cacheWrite: 0 }
        # Catalog GET /v1/models (probed 2026-11-05): reasoning_param
        # "reasoning_effort", mode "levels", ladder
        # minimal/low/medium/high/xhigh/max, top "max". Every tier plus a
        # negative case verified live (200s, 400 out-of-ladder).
        # No real off switch: the router normalizes "none" to "minimal", so
        # "thinking off" is deliberately absent from this ladder and OMP sends
        # "minimal" where it would omit the field. Probe widths were
        # non-monotonic (low 122 > medium 52 > high 0 reasoning tokens), noted
        # here rather than reshaped into a fake monotonic ladder.
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh, max]
          defaultLevel: low
          effortMap: {}
