# Casper - Ditto's homegrown OpenAI-compatible AI router.
#
# Endpoint:  https://casper-api.ditto.live/v1
# Auth:      export CASPER_API_KEY=... (or add CASPER_API_KEY=... to ~/.env)
#            The apiKey value below is resolved as an env-var name first, literal second.
# Catalog:   GET /v1/models publishes context_length/max_model_len plus a per-model
#            `reasoning_param` naming the thinking wire. Values seen there:
#              - "reasoning_effort"                    -> provider baseline below
#              - "chat_template_args.enable_thinking"   -> per-model extraBody override
#              - ""                                    -> non-reasoning model
#            Re-check `GET /v1/models` after the router adds or retires a model.
# Access:    Invocation is entitled per key, and `GET /v1/models` lists the whole
#            catalog regardless of entitlement. Verified 2026-08-24: this key may
#            invoke `kimi-k3` and `auto`; `kimi-k2.6`, `glm-5.2`, and `dittoaicoder`
#            return 403 {"detail":"not authorized to invoke <id>"}. The named models
#            stay declared below so that widening `enabledModels` in config.yml is
#            the only change needed once access is granted.
# Known issue: kimi-k3 tool calls arrive as a single buffered SSE delta emitted
#            only after the full arguments are generated - the stream carries only
#            ":" heartbeat comments while a tool call is being built. The silent
#            window scales with argument size (~20 tok/s observed), and the router
#            aborts Kimi streams at ~240s wall-clock with a
#            stream_deadline_exceeded error frame. See
#            ~/scripts/casper-kimi-tool-stall.py and .md for the repro harness and
#            fix request. The kimi-k3 streamIdleTimeoutMs override below is a local
#            mitigation only; it does not fix the underlying buffering.
providers:
  casper:
    baseUrl: https://casper-api.ditto.live/v1
    api: openai-completions
    apiKey: CASPER_API_KEY
    compat:
      # The router fronts self-hosted OSS engines, so OpenAI-only request
      # features are off and tool schemas go out non-strict.
      supportsStore: false
      supportsDeveloperRole: false
      supportsMultipleSystemMessages: false
      supportsUsageInStreaming: true
      maxTokensField: max_tokens
      supportsToolChoice: true
      supportsForcedToolChoice: true
      supportsStrictMode: false
      toolStrictMode: none
      # Majority wire: reasoning_effort. Models advertising a chat-template
      # switch override this per model.
      supportsReasoningEffort: true
      thinkingFormat: openai
      reasoningContentField: reasoning_content
      streamIdleTimeoutMs: 120000
    models:
      - id: auto
        name: Casper Auto Router
        reasoning: false
        input: [text]
        contextWindow: 131072
        maxTokens: 131072
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }

      - id: deepseek-v4-flash-0731
        name: DeepSeek V4 Flash (0731)
        reasoning: true
        input: [text]
        contextWindow: 1048576
        maxTokens: 1048576
        cost: { input: 0.13, output: 0.26, cacheRead: 0.028, cacheWrite: 0 }

      - id: deepseek-v4-pro
        name: Deepseek V4 Pro
        reasoning: true
        input: [text]
        contextWindow: 262144
        maxTokens: 262144
        cost: { input: 1.74, output: 3.48, cacheRead: 0.145, cacheWrite: 0 }

      - id: deepseek-v4-pro-0813
        name: DeepSeek V4 Pro (0813)
        reasoning: true
        input: [text]
        contextWindow: 1048576
        maxTokens: 1048576
        cost: { input: 1.74, output: 3.48, cacheRead: 0.145, cacheWrite: 0 }

      - id: glm-4.7
        name: Glm 4.7
        reasoning: true
        input: [text]
        contextWindow: 200000
        maxTokens: 200000
        cost: { input: 0.60, output: 2.20, cacheRead: 0.12, cacheWrite: 0 }
        compat:
          supportsReasoningEffort: false
          extraBody:
            chat_template_args:
              enable_thinking: false
          whenThinking:
            extraBody:
              chat_template_args:
                enable_thinking: true

      - id: glm-5.2
        name: Glm 5.2
        reasoning: true
        input: [text]
        contextWindow: 1048576
        maxTokens: 1048576
        cost: { input: 1.40, output: 4.40, cacheRead: 0.14, cacheWrite: 0 }

      - id: glm-5.2-fast
        name: Glm 5.2 Fast
        reasoning: true
        input: [text]
        contextWindow: 1048576
        maxTokens: 1048576
        cost: { input: 2.10, output: 6.60, cacheRead: 0.21, cacheWrite: 0 }

      - id: gpt-oss-120b
        name: GPT-OSS 120B
        reasoning: true
        input: [text]
        contextWindow: 131072
        maxTokens: 131072
        cost: { input: 0.10, output: 0.50, cacheRead: 0, cacheWrite: 0 }

      - id: inkling
        name: Inkling
        reasoning: true
        input: [text]
        contextWindow: 1048576
        maxTokens: 1048576
        cost: { input: 1.00, output: 4.05, cacheRead: 0.17, cacheWrite: 0 }

      - id: inkling-small
        name: Inkling Small
        reasoning: true
        input: [text]
        contextWindow: 1048576
        maxTokens: 1048576
        cost: { input: 0.50, output: 1.20, cacheRead: 0.10, cacheWrite: 0 }

      - id: kimi-k2.6
        name: Kimi K2.6
        reasoning: true
        input: [text]
        contextWindow: 262144
        maxTokens: 262144
        cost: { input: 0.95, output: 4.00, cacheRead: 0.16, cacheWrite: 0 }
        compat:
          supportsReasoningEffort: false
          extraBody:
            chat_template_args:
              enable_thinking: false
          whenThinking:
            extraBody:
              chat_template_args:
                enable_thinking: true

      - id: kimi-k2.7-code
        name: Kimi K2.7 Code
        reasoning: true
        input: [text]
        contextWindow: 262144
        maxTokens: 262144
        cost: { input: 0.95, output: 4.00, cacheRead: 0.16, cacheWrite: 0 }
        compat:
          supportsReasoningEffort: false
          extraBody:
            chat_template_args:
              enable_thinking: false
          whenThinking:
            extraBody:
              chat_template_args:
                enable_thinking: true

      - id: kimi-k3
        name: Kimi K3
        reasoning: true
        input: [text]
        contextWindow: 1048576
        maxTokens: 1048576
        cost: { input: 3.00, output: 15.00, cacheRead: 0.30, cacheWrite: 0 }
        compat:
          # Casper buffers each tool call and emits it as a single delta, so the
          # stream carries only SSE comments while arguments generate (~20 tok/s,
          # measured 2026-08-24). Stay below the router's ~240s Kimi wall-clock
          # deadline so a timeout surfaces as an error, not a silent empty turn.
          streamIdleTimeoutMs: 210000

      - id: nemotron-3-ultra
        name: Nemotron 3 Ultra
        reasoning: true
        input: [text]
        contextWindow: 202000
        maxTokens: 202000
        cost: { input: 0.60, output: 2.40, cacheRead: 0.12, cacheWrite: 0 }
        compat:
          supportsReasoningEffort: false
          # 550B class: first token can lag well past the provider floor.
          streamIdleTimeoutMs: 300000
          extraBody:
            chat_template_args:
              enable_thinking: false
          whenThinking:
            extraBody:
              chat_template_args:
                enable_thinking: true

      - id: qwen3.8-27b
        name: Qwen3.8 27B
        reasoning: true
        input: [text]
        contextWindow: 131072
        maxTokens: 131072
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        compat:
          supportsReasoningEffort: false
          extraBody:
            chat_template_args:
              enable_thinking: false
          whenThinking:
            extraBody:
              chat_template_args:
                enable_thinking: true
