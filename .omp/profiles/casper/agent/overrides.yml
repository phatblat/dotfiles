# Settings this profile layers over the main profile's .omp/agent/config.yml.
# `just generate-omp-profiles` renders config.yml from the two: maps merge,
# scalars and arrays replace, and main's modelRoles never carry over. Edit
# this file, then re-render; OMP writes /settings changes into config.yml,
# and the next render discards them.
modelRoles:
  default: casper/minimax-m3p1-flash
  task: casper/nemotron-lightning-3p5-30b-a3b
  commit: casper/nemotron-lightning-3p5-30b-a3b
  plan: casper/ember-1:high
  slow: casper/kimi-k3:high
  smol: casper/minimax-m3p1-flash
cycleOrder:
  - default
  - smol
  - plan
  - slow
steeringMode: one-at-a-time
followUpMode: one-at-a-time
tools:
  approval:
    bash: allow
memory:
  backend: "off"
includeWorkspaceTree: false
tui:
  imeSafeCursor: true
  tight: true
  resizeScrollback: preserve
terminal:
  showProgress: true
ask:
  timeout: 1800
browser:
  relay: true
# Keep the 90 s / 120 s stream watchdogs. Only the main profile raises
# them to 300 s, because Gemini 4 Argon can stay silent for more than 90 s.
providers:
  streamFirstEventTimeoutSeconds: 90
  streamIdleTimeoutSeconds: 120
# The feature-delivery team needs main's delivery_* modelRoles, which never
# carry over; opt in by adding an extensions: entry and those roles here.
extensions: []
