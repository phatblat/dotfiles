# Generated by `just generate-omp-profiles` from .omp/agent/config.yml and the
# overrides.yml beside this file. Edit overrides.yml, then re-render: OMP writes
# /settings changes here, and the next render discards them.
providers:
  anthropic:
    serverSideFallback: false
  streamFirstEventTimeoutSeconds: 90
  streamIdleTimeoutSeconds: 120
setupVersion: 2
modelRoles:
  default: casper/minimax-m3p1-flash
  task: casper/nemotron-lightning-3p5-30b-a3b
  commit: casper/nemotron-lightning-3p5-30b-a3b
  plan: casper/ember-1:high
  slow: casper/kimi-k3:high
  smol: casper/minimax-m3p1-flash
extensions: []
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
tools:
  approvalMode: yolo
  approval:
    bash: allow
bash:
  patterns:
    - match: sudo *
      approval: deny
    - match: sudo
      approval: deny
  allowCompoundCommands: true
  gitGuard: true
display:
  showTokenUsage: true
  cacheMissMarker: true
  hideToolActivity: true
  showTurnTime: true
  collapseCompacted: true
  shimmer: classic
  subagentLivePreview: true
advisor:
  enabled: false
  syncBacklog: "off"
prewalk:
  enabled: false
features:
  unexpectedStopDetection: smart
branchSummary:
  enabled: true
secrets:
  enabled: true
personality: pragmatic
cycleOrder:
  - default
  - smol
  - plan
  - slow
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: wait
memory:
  backend: "off"
autolearn:
  enabled: true
task:
  agentAdvisor:
    task: "on"
  showResolvedModelBadge: true
  eager: preferred
  enableEffort: true
  isolation:
    commits: ai
    enabled: true
    apply: true
worktree:
  base: ~/.worktrees
  cleanSource: true
  onStart: ask
  onExit: ask
  clone: false
hideThinkingBlock: false
theme:
  dark: dark-aurora
  light: light-aurora-day
symbolPreset: nerd
statusLine:
  preset: default
  separator: powerline-thin
  sessionAccent: true
  transparent: false
  showHookStatus: true
retry:
  usageAwareFallback: true
doubleEscapeAction: tree
composer:
  shape: field
  predictions: false
codexResets:
  autoRedeem: "no"
treeFilterMode: all
spelling:
  autocorrect: false
error:
  notify: "on"
skills:
  enableClaudeProject: false
  enableSkillCommands: true
  ignoredSkills:
    - codex/*
plan:
  autosave: false
commands:
  enableClaudeProject: false
  enableOpencodeProject: false
input:
  bareExitOnEmptySession: false
bashInterceptor:
  enabled: true
github:
  enabled: true
vault:
  enabled: true
checkpoint:
  enabled: true
ratchet:
  enabled: true
computer:
  enabled: true
generate_image:
  enabled: true
speechgen:
  enabled: true
find:
  enabled: auto
astGrep:
  enabled: true
goal:
  statusInFooter: false
includeWorkspaceTree: false
tui:
  imeSafeCursor: true
  tight: true
  resizeScrollback: rebuild
  completeScrollback: true
  codexResetFireworks: true
  titleSpinner: braille
  hyperlinks: always
terminal:
  showProgress: true
ask:
  timeout: 1800
browser:
  relay: true
