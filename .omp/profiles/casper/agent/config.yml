modelRoles:
  default: casper/kimi-k2.7-code
  task: casper/nemotron-lightning-3p5-30b-a3b
  commit: casper/nemotron-lightning-3p5-30b-a3b
  plan: casper/glm-5.3
  slow: casper/kimi-k3
  smol: casper/nemotron-lightning-3p5-30b-a3b
defaultThinkingLevel: auto
cycleOrder:
  - default
  - smol
  - plan
  - slow
personality: pragmatic
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: wait
hideThinkingBlock: false
tools:
  approvalMode: yolo
  approval:
    bash: allow
display:
  showTokenUsage: true
  cacheMissMarker: true
  hideToolActivity: true
  showTurnTime: true
  collapseCompacted: true
  shimmer: classic
advisor:
  enabled: false
  syncBacklog: "off"
prewalk:
  enabled: false
features:
  unexpectedStopDetection: smart
branchSummary:
  enabled: true
secrets:
  enabled: true
memory:
  backend: "off"
autolearn:
  enabled: true
task:
  agentAdvisor:
    task: "on"
  showResolvedModelBadge: true
worktree:
  base: ~/.worktrees
setupVersion: 2
includeWorkspaceTree: false
composer:
  shape: field
symbolPreset: nerd
theme:
  dark: dark-aurora
  light: light-aurora-day
retry:
  usageAwareFallback: true
dev:
  autoqaConsent: granted
tui:
  imeSafeCursor: true
  tight: true
  resizeScrollback: preserve
terminal:
  showProgress: true
statusLine:
  preset: default
  separator: powerline-thin
  sessionAccent: true
  transparent: false
  showHookStatus: true
codexResets:
  autoRedeem: "no"
ask:
  timeout: 1800
bash:
  allowCompoundCommands: true
