# Generated by `just generate-omp-profiles` from .omp/agent/config.yml and the
# overrides.yml beside this file. Edit overrides.yml, then re-render: OMP writes
# /settings changes here, and the next render discards them.
providers:
  anthropic:
    serverSideFallback: false
  streamFirstEventTimeoutSeconds: 90
  streamIdleTimeoutSeconds: 120
setupVersion: 2
modelRoles:
  default: baseten/moonshotai/Kimi-K2.7-Code:medium
  tiny: baseten/openai/gpt-oss-120b
  smol: baseten/deepseek-ai/DeepSeek-V4-Flash-0731
  slow: baseten/moonshotai/Kimi-K3
  plan: baseten/zai-org/GLM-5.2:high
  designer: baseten/zai-org/GLM-5.2-Fast:high
  advisor: baseten/nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B:medium
extensions: []
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
tools:
  approvalMode: yolo
bash:
  patterns:
    - match: sudo *
      approval: deny
    - match: sudo
      approval: deny
  allowCompoundCommands: true
  gitGuard: true
display:
  showTokenUsage: true
  cacheMissMarker: true
  hideToolActivity: true
  showTurnTime: true
  collapseCompacted: true
  shimmer: classic
advisor:
  enabled: false
  syncBacklog: "off"
prewalk:
  enabled: false
features:
  unexpectedStopDetection: smart
branchSummary:
  enabled: true
secrets:
  enabled: true
personality: pragmatic
cycleOrder:
  - default
  - plan
  - smol
  - slow
steeringMode: all
followUpMode: all
interruptMode: wait
memory:
  backend: "off"
autolearn:
  enabled: false
task:
  agentAdvisor:
    task: "on"
  showResolvedModelBadge: true
  eager: preferred
  enableEffort: true
  isolation:
    commits: ai
    enabled: true
    apply: true
worktree:
  base: ~/.worktrees
  cleanSource: true
  onStart: ask
  onExit: ask
  clone: false
hideThinkingBlock: false
theme:
  dark: titanium
  light: light-aurora-day
symbolPreset: unicode
statusLine:
  preset: default
  separator: powerline-thin
  sessionAccent: true
  transparent: false
  showHookStatus: true
retry:
  usageAwareFallback: true
doubleEscapeAction: tree
composer:
  shape: field
  predictions: false
codexResets:
  autoRedeem: "no"
treeFilterMode: all
spelling:
  autocorrect: false
error:
  notify: "on"
skills:
  enableClaudeProject: false
  enableSkillCommands: true
  ignoredSkills:
    - codex/*
plan:
  autosave: true
commands:
  enableClaudeProject: false
  enableOpencodeProject: false
input:
  bareExitOnEmptySession: false
bashInterceptor:
  enabled: true
github:
  enabled: true
vault:
  enabled: true
checkpoint:
  enabled: true
ratchet:
  enabled: true
computer:
  enabled: true
generate_image:
  enabled: true
speechgen:
  enabled: true
find:
  enabled: auto
astGrep:
  enabled: true
