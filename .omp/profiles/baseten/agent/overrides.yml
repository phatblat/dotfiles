# Settings this profile layers over the main profile's .omp/agent/config.yml.
# `just generate-omp-profiles` renders config.yml from the two: maps merge,
# scalars and arrays replace, and main's modelRoles never carry over. Edit
# this file, then re-render; OMP writes /settings changes into config.yml,
# and the next render discards them.
modelRoles:
  default: baseten/moonshotai/Kimi-K2.7-Code:medium
  tiny: baseten/openai/gpt-oss-120b
  smol: baseten/deepseek-ai/DeepSeek-V4-Flash-0731
  slow: baseten/moonshotai/Kimi-K3
  plan: baseten/zai-org/GLM-5.2:high
  designer: baseten/zai-org/GLM-5.2-Fast:high
  advisor: baseten/nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B:medium
symbolPreset: unicode
theme:
  dark: titanium
# baseten never enabled long-term memory or autolearn; keep it that way
# instead of inheriting main's mnemopi backend and autolearn.
memory:
  backend: "off"
autolearn:
  enabled: false
