#
# gitleaks secret-scanning config for phatblat/dotfiles.
#
# Extends gitleaks' built-in ruleset rather than replacing it, so upstream
# rule additions/fixes keep applying on every `mise upgrade`:
# https://github.com/gitleaks/gitleaks/blob/v8.30.1/config/gitleaks.toml
#
title = "phatblat/dotfiles"

[extend]
useDefault = true

[[allowlists]]
description = "ness guard cases: every file under this path intentionally embeds fake secrets to exercise ness's deny rules (decision 2026-10-17-ness-policy-as-data moved them from crates/ness/tests/corpus/)"
paths = [
  '''^\.config/ness/cases/''',
]

[[allowlists]]
description = "Vendored skill doc: truncated illustrative JWT example, not a live token"
paths = [
  '''^\.claude/agent-skills/README\.md$''',
]
