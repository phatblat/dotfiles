[workspace]

[package]
name = "ness"
version = "0.1.0"
edition = "2021"
description = "Compiled PreToolUse guard for the shared agent harness safety policy."
publish = false

[[bin]]
name = "ness"
path = "src/main.rs"

[dependencies]
fancy-regex = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
