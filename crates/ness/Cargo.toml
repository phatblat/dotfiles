[workspace]

[package]
name = "ness"
version = "0.4.0"
edition = "2021"
description = "Compiled PreToolUse guard for the shared agent harness safety policy."
publish = false

[[bin]]
name = "ness"
path = "src/main.rs"

[dependencies]
fancy-regex = "0.20"
brush-parser = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "0.9"
wait-timeout = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true
