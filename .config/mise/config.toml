#
# ~/.config/mise/config.toml
# https://mise.jdx.dev/configuration.html
#

# mise-managed tools, ordered alphabetically
# scripts/sort-tools.py drops comments inside [tools], so notes on tool options
# live here. hk's `workflow` is a packslip backend option: it pins the repository
# workflow that signs hk releases, so mise rejects releases signed by any other
# workflow. `npm:@anthropic-ai/claude-code` sets `allow_builds` so its postinstall
# links the platform native binary over the `bin/claude.exe` stub.
# `mise upgrade --bump` rewrites only `version`, so the table form survives bumps.
