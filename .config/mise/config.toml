[env]
DENO_TLS_CA_STORE = "system"
NODE_USE_SYSTEM_CA = "1"
UV_SYSTEM_CERTS = "1"

# macOS calloc(3) doesn't reliably zero allocations, so tmux's configure
# script refuses to proceed without an explicit --enable/--disable choice
# for jemalloc and utf8proc. The asdf-tmux plugin only forwards a single
# unsplit word via TMUX_EXTRA_CONFIGURE_OPTIONS, so two flags can't be
# passed that way; set the autoconf-generated `enable_*` shell variables
# directly instead, which configure honors from the environment.
enable_jemalloc = "no"
enable_utf8proc = "no"

# Agent/tool output
ENABLE_LSP_TOOL = "1"

# Homebrew behavior
HOMEBREW_NO_ASK = "1"
HOMEBREW_NO_ENV_HINTS = "1"
HOMEBREW_CLEANUP_MAX_AGE_DAYS = "30"

# Locale
LANG = "en_US.UTF-8"
LANGUAGE = "en_US.UTF-8"
LC_ALL = "en_US.UTF-8"
LC_CTYPE = "en_US.UTF-8"

# BSD ls colors
CLICOLOR = "1"
LSCOLORS = "ExFxBxDxCxegedabagacad"

# Editor selection inputs. The conditional EDITOR/VISUAL/WAIT_FLAG assignment is moved
# below mise activation in zsh and config.nu so these shared inputs are available before
# the shell-specific branch runs.
EDITOR_CLI = "nvim"
EDITOR_GUI = "zed"
WAIT_FLAG_CLI = "--nofork"
WAIT_FLAG_GUI = "--wait"

# Xcode
DERIVED_DATA = "{{env.HOME}}/Library/Developer/Xcode/DerivedData"

# iCloud (consumed by .config/zsh/functions/icloud)
ICLOUD_HOME = "{{env.HOME}}/Library/Mobile Documents"

# Go
GOPATH = "{{env.HOME}}/go"
GOPRIVATE = "github.com/phatblat/*"

# Homebrew keg-only toolchains (llvm, icu4c) — previously duplicated in .zshrc
LDFLAGS = "-L/opt/homebrew/opt/llvm/lib"
CPPFLAGS = "-I/opt/homebrew/opt/llvm/include"
CMAKE_PREFIX_PATH = "/opt/homebrew/opt/llvm"
CGO_CFLAGS = "-I/opt/homebrew/opt/icu4c/include"
CGO_CXXFLAGS = "-I/opt/homebrew/opt/icu4c/include"
CGO_LDFLAGS = "-L/opt/homebrew/opt/icu4c/lib"
PKG_CONFIG_PATH = "/opt/homebrew/opt/icu4c/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

CC_wasm32_unknown_unknown = "/opt/homebrew/opt/llvm/bin/clang"

# Android build + CLI tools on PATH (adb, sdkmanager, emulator, aapt/apksigner).
# mise emits these on every hook, so they survive in nushell where mise owns PATH.
# build-tools is pinned to the latest installed version — bump when SDK updates.
_.path = [
  "{{env.HOME}}/Library/Android/sdk/platform-tools",
  "{{env.HOME}}/Library/Android/sdk/cmdline-tools/latest/bin",
  "{{env.HOME}}/Library/Android/sdk/emulator",
  "{{env.HOME}}/Library/Android/sdk/build-tools/36.0.0",
  "{{env.HOME}}/go/bin",
  # Nix: user profile, then daemon profile (which provides `nix` itself)
  "{{env.HOME}}/.nix-profile/bin",
  "/nix/var/nix/profiles/default/bin",
]

[settings]
experimental = true
pin = true
idiomatic_version_file_enable_tools = ["node"]
# No committed mise.lock: fresh bootstraps resolve the newest release older
# than this window, so installs within 24h of a tool bump above can differ
# from what was current at merge time.
minimum_release_age = "24h"
# claude-code, codex, and oh-my-pi ship fixes frequently; skip the 24h
# minimum_release_age default for them.
minimum_release_age_excludes = ["claude-code", "codex", "oh-my-pi"]
use_versions_host = false

[settings.python]
uv_venv_auto = "source"

[settings.aqua]
github_attestations = false

[settings.npm]
package_manager = "npm"

[bootstrap.packages]
"brew-cask:openusage" = "latest"
