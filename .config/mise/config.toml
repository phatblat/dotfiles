#
# ~/.config/mise/config.toml
# https://mise.jdx.dev/configuration.html
#

# mise-managed tools, ordered alphabetically
# scripts/sort-tools.py drops comments inside [tools], so notes on tool options
# live here. hk's `workflow` is a packslip backend option: it pins the repository
