allow_exact = ["claude mcp list", "env", "pwd", "true"]
prompt_prefix = ["rm"]
deny_prefix = ["sudo"]

[approval.modes]
claude_default_mode = "auto"
omp_approval_mode = "write"
opencode_edit = "ask"
opencode_external_directory = "ask"
opencode_webfetch = "ask"

[approval.claude]
webfetch_domains = ["docs.basedpyright.com", "github.com"]
tools = ["WebSearch", "mcp__acp__Bash", "mcp__acp__Edit", "mcp__acp__Write"]
