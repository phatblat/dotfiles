# ness safety policy — decision 2026-10-17-ness-policy-as-data.
#
# Every pattern is a fancy-regex expression in a TOML literal string ('...'
# or '''...'''); no escaping is applied by TOML, so write the regex exactly.
# This file is control plane: the guard denies agent writes to it, and the
# binary refuses to load it until a human has run `ness policy apply`.
#
# To change policy: write a candidate to ~/.local/state/ness/proposals/<slug>/policy.toml,
# add cases under ~/.config/ness/cases/, run `ness policy check <candidate>`,
# then a human runs `ness policy apply <candidate>`.

# Paths the guard denies agent writes to. New entries must be pinned by a 9xx case under ~/.config/ness/cases/ (older entries are pinned by 09x cases).
[control_plane]
patterns = [
  '/\.agents/harness/hooks/',
  '/\.agents/harness/self-improve-policy\.json(?![\w.-])',
  '/\.agents/harness/generated-paths\.json(?![\w.-])',
  '/scripts/agent-harnesses\.py(?![\w.-])',
  '/scripts/agent_plugins\.py(?![\w.-])',
  '/scripts/harness_policy\.py(?![\w.-])',
  '/harness-guard\.(?:py|sh|ts)(?![\w.-])',
  '/(?:write|bash)-guard\.sh(?![\w.-])',
  '/opencode/plugins/harness\.ts(?![\w.-])',
  '/agent/extensions/harness\.ts(?![\w.-])',
  '/harness-guard\.json(?![\w.-])',
  '/crates/ness/(?!target(?:/|$))',
  # The policy itself, the last-apply record, and the binary: active::REQUIRED_PROTECTED_PATHS; `ness policy check` refuses a candidate that drops any of them.
  '/\.config/ness/policy\.toml(?![\w.-])',
  '/\.local/state/ness/applied\.json(?![\w.-])',
  '/\.local/bin/ness(?![\w.-])',
]

# Secrets on disk: never written by an agent, through any tool or shell.
[protected_paths]
patterns = [
  '(?i)(\.env($|\.)|\.ssh/|id_(rsa|ed25519|ecdsa)|\.pem$|\.key$|\.p12$|\.pfx$|\.jks$|\.aws/credentials|\.docker/config\.json|kubeconfig|\.npmrc$|\.pypirc$|\.netrc$|\.pgpass$|\.htpasswd$|\.git-credentials|\.claude/\.credentials\.json|\.codex/auth\.json|\.omp/agent/agent\.db|\.omp/agent/secrets\.yml|\.pi/agent/auth\.json|\.gemini/google_accounts\.json|\.gemini/oauth_creds\.json|\.gemini/antigravity-cli/installation_id|\.gemini/antigravity-cli/conversations/|\.cursor/ai-tracking/|\.grok/auth\.json|\.grok/mcp_credentials\.json|\.config/crush/crush\.json|\.local/share/crush/crush\.json|\.local/share/crush/crush\.db)',
]

# Secret-shaped content in anything written, including heredocs in shell commands.
[secret_content]
patterns = [
  # sk- must start a token: kebab-case words such as task-… or risk-… contain it mid-word.
  '''(?i)(AKIA[0-9A-Z]{16}|(?<![A-Za-z0-9_-])sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|glpat-[A-Za-z0-9_-]{20,}|xox[bpoas]-[A-Za-z0-9-]+|-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----|password\s*[:=]\s*["'][^"']{8,}["'])'''
]

[commands.privilege_escalation]
patterns = ['(?i)(^|;|&&|\|\||\||\n|\r|\$\(|`)\s*(sudo|su|doas|pkexec)\b']

[commands.dangerous]
patterns = [
  '(?i)\brm\s+-(?=[A-Za-z-]*r)(?=[A-Za-z-]*f)[A-Za-z-]*\s+(/|~|\*|\.\.)',
  '(?i)>\s*/dev/sd[a-z]?',
  '(?i)\bmkfs(\.|\s)',
  '(?i)\bdd\s+if=.*\s+of=/dev/',
  '(?i)\bchmod\s+(-R\s+)?777\b',
  '(?i)\bchmod\s+\+s\b',
  '(?i):\(\)\{.*:\|:&\};',
  '(?i)\b(curl|wget)\b[^|]*\|\s*(ba)?sh\b',
  '(?i)\b(truncate|shred)\b',
  # Only a human at a terminal applies policy (active::REQUIRED_DENIED_COMMAND). Anchored to command position so prose that mentions the command (commit messages, rg) is not denied.
  '(?i)(^|[;&|`\n]|\$\()\s*(\S*/)?ness\s+policy\s+apply\b',
]

[commands.obfuscated]
patterns = [
  '(?i)\beval\s+.*\$',
  '(?i)\bbase64\s+-d.*\|\s*(ba)?sh\b',
  '(?i)\bawk\s+.*system\s*\(',
  '(?i)\bbash\s+<\(',
]

# `gh auth token`, `gh auth status --show-token` (also as a short flag, alone
# or clustered: `-t`, `-at`, `-ta`) and `gh auth git-credential get` print
# the stored credential.
[commands.credential_disclosure]
patterns = ['(?i)\bgh\s+auth\s+(?:token\b|git-credential\s+get\b|status\b[^;&|\n]*\s(?:--show-token\b|-[a-z]*t[a-z]*\b))']

# Codex `unified_exec` keeps a launched process open and `write_stdin` never
# re-runs `PreToolUse`: a bare interactive shell/REPL launch would let every
# later command bypass the guard. Reading the program from stdin (`bash -s`,
# `bash -`, `python3 -`) is the same bypass. Matched per `&&`/`||`/`;`/newline
# segment, after any `env`/`nohup`-style launcher prefix (including `VAR=val`
# assignments and launcher flags), with the stdin/interactive short flags
# allowed in clusters (`-il`, `-iq`).
[commands.interactive_launch]
patterns = ['(?:^|&&|\|\||\||;|\n|\(|\{)\s*(?:(?:\S*/)?(?:env|exec|command|nohup|time)(?:\s+(?:-\S+|\w+=\S*))*\s+)*(?:(?:\S*/)?(?:bash|zsh|sh|dash|ksh|fish|nu)(?:\s+-(?![A-Za-z]*c)[A-Za-z]*s[A-Za-z]*(?:(?!\s-[A-Za-z]*c\b)\s+\S+)*|(?:\s+(?:--(?:rcfile|init-file)\s+\S+|--(?!command\b)[A-Za-z][\w-]*|-(?![A-Za-z]*c)[A-Za-z]+|[-+]o\s+\w+))*(?:\s+-)?)|(?:\S*/)?(?:python3?(?:\.\d+)?|node|bun|deno|irb|ruby|lua|psql|sqlite3|mysql|redis-cli)(?:\s+repl)?(?:\s+(?:--(?!eval\b|print\b|command\b)[A-Za-z][\w-]*(?:=\S+)?|-(?![A-Za-z]*[cemp])[A-Za-z]+))*(?:\s+-)?|(?:tmux|screen)(?:\s+(?:new(?:-session)?|attach(?:-session)?|-[A-Za-z]+))*|ssh(?:\s+-(?![A-Za-z]*[TNnfW])[A-Za-z]+)*\s+[\w.@-]+)\s*(?:$|(?=&&|\|\||\||;|\n|\)|\}))']

# Deliberately case-sensitive (matches the original Python source).
[commands.warn]
commit = '^\s*(git\s+commit|git\s+-C\s+\S+\s+commit)\b'

# How the guard finds the paths a shell command writes to. Each entry except
# path_token must define a (?P<span>...) group.
[write_targets]
redirect = '>>?\s*(?P<span>[^\s;|&<>]+)'
mutating_argv = '(?i)\b(?:rm|mv|cp|tee|ln|install|truncate|shred|unlink|touch|chmod|chown)\b(?P<span>[^;|&]*)'
sed_inplace = '(?i)\bsed\b(?P<span>[^;|&]*?-i(?:\S*)?[^;|&]*)'
dd = '(?i)\bdd\b[^;|&]*?\bof=(?P<span>[^\s;|&]+)'
path_token = '''[^\s;|&<>'"]*[/~][^\s;|&<>'"]*'''

# Per-harness approval baselines (bash allow lists, prompt-even-in-yolo, absolute deny).
