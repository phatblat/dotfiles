file = ["-C", "--compile"]
find = ["-delete", "-exec", "-execdir", "-ok", "-okdir", "-fls", "-fprint", "-fprint0", "-fprintf"]
git = ["--output", "-O", "--open-files-in-pager"]
rg = ["--pre"]
sed = ["-i", "--in-place"]
sg = ["-U", "--update-all", "-i", "--interactive"]
shfmt = ["-w", "--write"]
sort = ["-o", "--output"]
tree = ["-o"]
typos = ["-w", "--write-changes"]
yq = ["-i", "--inplace"]

# Options whose value is a file the command writes: allowed only when it is a sink or inside scratch_dirs.
[shell.output_options]
curl = ["-o", "--output", "-D", "--dump-header", "-c", "--cookie-jar", "--trace", "--trace-ascii", "--stderr", "--etag-save", "--libcurl", "--hsts", "--alt-svc", "--ssl-sessions", "--expand-output", "--expand-dump-header", "--expand-cookie-jar", "--expand-trace", "--expand-trace-ascii", "--expand-stderr", "--expand-etag-save", "--expand-libcurl", "--expand-hsts", "--expand-alt-svc", "--expand-ssl-sessions"]
docker = ["-o", "--output"]

# Substrings that make a read_only command prompt wherever they appear in its words, as typed or as the shell resolves them (`-w '%out'put{f}` is `%output{f}`): curl -w/--write-out '%output{file}' (curl >= 8.3) writes a file.
[shell.write_markers]
curl = ["%output{"]

# Options whose value is checked for the markers above. A value the shell cannot resolve (`curl -w "$fmt"`, `-w "$(cat f)"`) could hold a marker, so it prompts.
[shell.marker_options]
curl = ["-w", "--write-out", "--expand-write-out"]

# Fetchers whose output must not reach these interpreters: `curl URL | python3` runs remote code. Each sink is the interpreter followed by the options that supply inline code (`python3 -c '...'`): with those, stdin is data and the pipe is allowed. A stage is the command it runs once quoting is resolved and launchers (env, nohup, timeout, xargs) are peeled off, so `| env python3`, `| (python3)` and `env curl URL |` count, and a name followed by a version (`python3.12`) is that interpreter. The same fetcher feeding an interpreter through a process substitution or stdin redirect (`python3 <(curl URL)`) prompts too. Each pipeline stage is otherwise classified on its own.
[shell.pipe_into]
curl = ["Rscript -e", "deno", "julia -e", "lua -e", "make", "node -e -p --eval --print", "nodejs -e -p --eval --print", "osascript -e", "perl -e -E", "php -r", "pypy3 -c", "python -c", "python3 -c", "ruby -e", "tclsh"]
wget = ["Rscript -e", "deno", "julia -e", "lua -e", "make", "node -e -p --eval --print", "nodejs -e -p --eval --print", "osascript -e", "perl -e -E", "php -r", "pypy3 -c", "python -c", "python3 -c", "ruby -e", "tclsh"]

# Launchers: the command after their options/operands (or after separator) is classified instead, and must itself be on a list. prompt_options take a command string and always prompt. A launcher whose options or operands are not literal (`timeout "$N" cmd`) prompts, and no session approval covers it, as does an `--opt=value` that is not in value_options: GNU getopt accepts abbreviations, so `env --sp='cmd'` is `--split-string`.
[shell.wrappers.env]
value_options = ["-u", "--unset", "-C", "--chdir"]
operands = 0
assignments = true
appends_operands = false
separator = ""
prompt_options = ["-P", "-S", "--split-string"]

[shell.wrappers."mise exec"]
value_options = []
operands = 0
assignments = false
appends_operands = false
separator = "--"
prompt_options = ["-c", "--command"]

[shell.wrappers."mise x"]
value_options = []
operands = 0
assignments = false
appends_operands = false
separator = "--"
prompt_options = ["-c", "--command"]

[shell.wrappers.nice]
value_options = ["-n", "--adjustment"]
operands = 0
assignments = false
appends_operands = false
separator = ""
prompt_options = []

[shell.wrappers.nohup]
value_options = []
operands = 0
assignments = false
appends_operands = false
separator = ""
prompt_options = []

[shell.wrappers.timeout]
value_options = ["-s", "--signal", "-k", "--kill-after"]
operands = 1
assignments = false
appends_operands = false
separator = ""
prompt_options = []

[shell.wrappers.xargs]
value_options = ["-E", "-I", "-J", "-L", "-P", "-R", "-S", "-a", "-d", "-n", "-s", "--arg-file", "--delimiter", "--eof", "--max-args", "--max-chars", "--max-lines", "--max-procs", "--replace"]
operands = 0
assignments = false
separator = ""
prompt_options = []
appends_operands = true

# Options skipped before matching the next word of a multi-word entry, keyed by the words matched so far (git -C dir log; docker compose -p x ps). Unlisted ones (git -c, which can run commands) never match.
[shell.leading_options.git]
flags = ["--bare", "--literal-pathspecs", "--no-optional-locks", "--no-pager", "--no-replace-objects", "-P"]
value_options = ["-C", "--git-dir", "--namespace", "--work-tree"]

[shell.leading_options.gh]
flags = []
value_options = ["-R", "--repo", "--hostname"]

[shell.leading_options.npx]
flags = ["--no", "--no-install", "--yes", "-y", "-q", "--quiet", "--"]
value_options = ["-p", "--package"]

[shell.leading_options."docker compose"]
flags = ["--all-resources", "--compatibility", "--dry-run"]
value_options = ["-f", "--file", "-p", "--project-name", "--profile", "--env-file", "--project-directory", "--ansi", "--progress", "--parallel"]

[shell.leading_options."git config"]
flags = ["--show-origin", "--show-scope", "--null", "-z", "--name-only", "--includes", "--no-includes"]
value_options = []

[shell.leading_options.tofu]
flags = []
value_options = ["-chdir"]
