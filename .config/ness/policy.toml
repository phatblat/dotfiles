# Bash classification behind the `prompt` verdict. It runs only after every deny
# category above has passed. ness parses the command (brush-parser) and checks every
# simple command it reaches: pipelines, && || ;, loops, conditionals, subshells,
# $(...), backticks, <(...). read_only/allow_write matches and writes confined to
# scratch_dirs -> allow. Writes outside scratch_dirs, write_flags, output_options
# targets outside scratch_dirs, protected_env assignments, and unparseable input ->
# prompt. A command on no list: unrecognized = "allow" runs it unless its name
# (argv0 basename) is in guarded; a command reached through a wrapper must be on a
# list. Allow mode compares names case-insensitively (macOS volumes fold case, so
# `RM -rf x` runs rm) and never recognizes a name with non-ASCII characters.
# unrecognized = "prompt" asks for every unlisted command and matches argv0
# literally. omp's harness-guard hook shows a dialog for `prompt` (a guarded or
# unrecognized command can be approved for the rest of the session: that exact
# command line only, and never a no_session_approval name) and blocks
# when headless. Every other harness treats `prompt` like allow. Entries are argv
# prefixes compared word by word. Apply with `ness policy apply`.
[shell]
# A write runs without a prompt when every target is strictly inside one of these
# (symlinks are resolved first).
scratch_dirs = ["/tmp", "/private/tmp", "/var/folders", "/private/var/folders"]
# Redirect/path targets that are never writes.
sinks = ["/dev/null", "/dev/stdout", "/dev/stderr", "/dev/tty", "/dev/fd/1", "/dev/fd/2"]
# Assigning one of these (bare, prefix, export/declare/..., env) prompts. They
# change what later commands run, and shell variables persist across omp bash
# calls. A trailing * matches a prefix.
protected_env = ["BASH_ENV", "DYLD_*", "ENV", "GIT_ASKPASS", "GIT_CONFIG*", "GIT_EDITOR", "GIT_EXEC_PATH", "GIT_EXTERNAL_DIFF", "GIT_PAGER", "GIT_SSH", "GIT_SSH_COMMAND", "LD_*", "PAGER", "PATH", "PROMPT_COMMAND"]
# Commands on no list: "allow" runs them unless guarded; "prompt" asks for each.
unrecognized = "allow"
# Command names (argv0 basenames) that prompt unless a read_only/allow_write entry matches: tools whose effects ness cannot see (remote APIs, containers, package managers, file mutators that are not path_writers) and launchers that run a command ness would not classify.
guarded = [".", "PlistBuddy", "agy", "alias", "ansible", "ansible-playbook", "arch", "asdf", "at", "aws", "az", "bash", "batch", "bq", "brew", "builtin", "bundle", "bunzip2", "bzip2", "caffeinate", "cargo", "chflags", "chgrp", "chmod", "chown", "claude", "codesign", "codex", "colima", "command", "conda", "container", "cpio", "crontab", "crush", "csrutil", "cursor-agent", "dash", "dd", "defaults", "direnv", "diskutil", "ditto", "docker", "docker-compose", "doas", "doctl", "dotnet", "dscl", "duckdb", "ed", "emacs", "enable", "eval", "ex", "exec", "fastlane", "fc", "firebase", "fish", "flock", "fly", "flyctl", "ftp", "gcloud", "gem", "gemini", "gh", "git", "glab", "go", "gradle", "gradlew", "grok", "gsutil", "gtimeout", "gunzip", "gzip", "halt", "hdiutil", "helm", "heroku", "http", "influx", "install", "installer", "kill", "killall", "kind", "ksh", "kubectl", "launchctl", "ln", "mamba", "mas", "minikube", "mise", "mkfifo", "mknod", "mongosh", "mount", "mvn", "mysql", "nano", "nc", "ncat", "netlify", "networksetup", "nix", "npm", "npx", "nu", "nvim", "op", "open", "opencode", "openssl", "osascript", "parallel", "patch", "perl", "pip3", "pipx", "pkgutil", "pkill", "plutil", "pmset", "pod", "podman", "popd", "port", "psql", "pulumi", "pushd", "railway", "reboot", "redis-cli", "rsync", "ruby", "rustup", "sandbox-exec", "scp", "screen", "script", "scutil", "security", "sftp", "sh", "shopt", "shred", "shutdown", "socat", "softwareupdate", "source", "spctl", "split", "sponge", "sqlite3", "srm", "ssh", "ssh-add", "ssh-keygen", "stdbuf", "stripe", "su", "sudo", "sudoedit", "supabase", "swift", "sysadminctl", "systemsetup", "tar", "telnet", "terraform", "terragrunt", "time", "tmutil", "tmux", "tofu", "trap", "trash", "truncate", "umount", "unbuffer", "unxz", "unzip", "unzstd", "uv", "uvx", "vault", "vercel", "vi", "vim", "watch", "wget", "wrangler", "xattr", "xcodebuild", "xcrun", "xh", "xz", "zip", "zsh", "zstd"]
